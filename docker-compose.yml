services:
  backend:
    build: ./backend
    security_opt:
      - seccomp:unconfined
    container_name: point_vis_backend
    environment:
      - DATA_PATH=${DATA_PATH}
      - DATA_WEBSERVER_PATH=${DATA_WEBSERVER_PATH}
    volumes:
      - ./backend:/app
      - ${DATA_PATH}:${DATA_PATH}
      - ${DATA_WEBSERVER_PATH}:${DATA_WEBSERVER_PATH}

  nginx:
    build: ./
    environment:
      - USE_SSL=${USE_SSL:-1}
      - EXTERNAL_PORT=${EXTERNAL_PORT:-8081}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx_ssl.conf
      - ./nginx/nginx_nossl.conf:/etc/nginx/nginx_nossl.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./certbot/www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: /bin/sh -c "if [ \"${USE_SSL}\" = \"1\" ]; then cp /etc/nginx/nginx_ssl.conf /etc/nginx/nginx.conf; else cp /etc/nginx/nginx_nossl.conf /etc/nginx/nginx.conf; fi && exec nginx -g 'daemon off;'"
    ports:
      - "8080:80"
      - "${EXTERNAL_PORT}:443"
    depends_on:
      - backend
